name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven
      # mvnw is stored without the executable bit when committed from Windows.
      - run: chmod +x mvnw
      - run: ./mvnw -B test

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            src/main/Frontend/react/package-lock.json
      # react-pdf, jwt-decode, react-icons and react-toastify resolve through the
      # repo-root package.json until S6 moves them.
      - run: npm ci
      - run: npm ci
        working-directory: src/main/Frontend/react
      - run: npm run build
        working-directory: src/main/Frontend/react
      - run: node scripts/check-lint.mjs
        working-directory: src/main/Frontend/react
