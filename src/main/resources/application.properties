spring.application.name=Classroom

# Local values live in a git-ignored .env at the repo root (see .env.example).
# Real environment variables override it.
spring.config.import=optional:file:.env[.properties]

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/classroom}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
# Off on purpose: tools/ToolsOpenInView registers open-in-view for every route but /api/tools/**, whose requests
# wait for the model and must not hold a database connection meanwhile. The app refuses to start if this is turned
# back on.
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

logging.level.root=INFO
logging.level.com.Classroom_ai=DEBUG
upload.dir=${UPLOAD_DIR:uploads}
upload.max-size=${UPLOAD_MAX_SIZE:20MB}
upload.max-picture-size=${UPLOAD_MAX_PICTURE_SIZE:2MB}

jwt.secret=${JWT_SECRET:}

# TextGeneration adapter: "fake" is deterministic and needs no model.
generation.adapter=${GENERATION_ADAPTER:fake}

# The "local" adapter talks to a server that speaks the OpenAI chat-completions API (llama.cpp, for one).
generation.base-url=${GENERATION_BASE_URL:}
generation.model=${GENERATION_MODEL:}
generation.timeout=${GENERATION_TIMEOUT:120s}
generation.chunk-chars=${GENERATION_CHUNK_CHARS:10000}
generation.max-chunks=${GENERATION_MAX_CHUNKS:40}

# The AI tools page: anyone may use it once without an account. Visitors are kept only as SHA-256(salt + value),
# so the salt is required (like JWT_SECRET); the app will not start without it. Trust X-Forwarded-For only when
# a proxy you run sets it.
tools.trial.salt=${TOOLS_TRIAL_SALT:}
tools.trial.trust-forwarded=${TOOLS_TRIAL_TRUST_FORWARDED:false}

# Largest input to the AI tools: a visitor with no account, and a signed-in user. The PDF size of a signed-in
# user is upload.max-size. A PDF is also held to the character limit, counted on its extracted text.
tools.anon.max-chars=${TOOLS_ANON_MAX_CHARS:20000}
tools.anon.max-pdf=${TOOLS_ANON_MAX_PDF:5MB}
tools.max-chars=${TOOLS_MAX_CHARS:100000}

# The chat keeps no history on the server: the client sends it all each time, so it is bounded here.
tools.chat.max-messages=${TOOLS_CHAT_MAX_MESSAGES:20}
tools.chat.max-message-chars=${TOOLS_CHAT_MAX_MESSAGE_CHARS:4000}
