spring.application.name=Classroom

# Local values live in a git-ignored .env at the repo root (see .env.example).
# Real environment variables override it.
spring.config.import=optional:file:.env[.properties]

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/classroom}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

logging.level.root=INFO
logging.level.com.Classroom_ai=DEBUG
upload.dir=${UPLOAD_DIR:uploads}
upload.max-size=${UPLOAD_MAX_SIZE:20MB}
upload.max-picture-size=${UPLOAD_MAX_PICTURE_SIZE:2MB}

jwt.secret=${JWT_SECRET:}

# TextGeneration adapter: "fake" is deterministic and needs no model.
generation.adapter=${GENERATION_ADAPTER:fake}

# The "local" adapter talks to a server that speaks the OpenAI chat-completions API (llama.cpp, for one).
generation.base-url=${GENERATION_BASE_URL:}
generation.model=${GENERATION_MODEL:}
generation.timeout=${GENERATION_TIMEOUT:120s}
generation.chunk-chars=${GENERATION_CHUNK_CHARS:10000}
